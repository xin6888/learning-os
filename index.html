<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的专属学习OS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background-color: #2c2c2c;
      color: #ffffff;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 0;
    }

    .wrap {
      width: min(720px, 90%);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 32px;
    }

    input {
      width: 100%;
      height: 56px;
      padding: 0 18px;
      font-size: 1rem;
      color: #ffffff;
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 10px;
      outline: none;
    }

    input::placeholder {
      color: #bdbdbd;
    }

    button {
      margin-top: 18px;
      height: 48px;
      padding: 0 28px;
      font-size: 1rem;
      color: #ffffff;
      background: #4a4a4a;
      border: 1px solid #666;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #5a5a5a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 24px;
      padding: 18px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.6;
      background: #3a3a3a;
      border: 1px solid #555;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🚀 我的专属学习OS</h1>
    <input id="topic" type="text" placeholder="输入你想学的知识点">
    <button id="generate" type="button">生成任务卡</button>
    <div id="result"></div>
  </div>

  <script>
    const API_KEY = "sk-3d645f3defe447d68a4ca872d3ec3178";
    const API_URL = "https://api.deepseek.com/chat/completions";
    const PROMPT = "你现在是一个数学/编程教练。请根据我输入的知识点，给我列出一个具体的实操任务卡，以及一个微变式选择题。不要废话，直接输出。";

    const topicInput = document.getElementById("topic");
    const generateBtn = document.getElementById("generate");
    const resultBox = document.getElementById("result");

    function showResult(text) {
      resultBox.style.display = "block";
      resultBox.textContent = text;
    }

    async function generateCard() {
      const topic = topicInput.value.trim();
      if (!topic) {
        showResult("请先输入你想学的知识点。");
        return;
      }

      generateBtn.disabled = true;
      showResult("正在生成任务卡...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
          },
          body: JSON.stringify({
            model: "deepseek-chat",
            messages: [
              { role: "system", content: PROMPT },
              { role: "user", content: topic }
            ]
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error && data.error.message ? data.error.message : "请求失败");
        }

        const content = data.choices && data.choices[0] && data.choices[0].message
          ? data.choices[0].message.content
          : "";
        showResult(content || "没有返回内容。");
      } catch (error) {
        showResult("生成失败：" + error.message);
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener("click", generateCard);
    topicInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        generateCard();
      }
    });
  </script>
</body>
</html>
